  .veil { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
          background: -webkit-linear-gradient(top, rgba(12,0,4,.5), rgba(12,0,4,.18) 45%, rgba(12,0,4,.55));
          background: linear-gradient(180deg, rgba(12,0,4,.5), rgba(12,0,4,.18) 45%, rgba(12,0,4,.55)); }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 22px 16px 48px; }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin: 6px 2px 6px;
       background: -webkit-linear-gradient(left, #fff, #ffb3c4); background: linear-gradient(90deg, #fff, #ffb3c4);
       -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .sub { margin: 0 2px 18px; font-size: 14px; color: rgba(255,224,230,.65); line-height: 1.5; }

  .head { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
          -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
  .net { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center;
         padding: 6px 12px 6px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap;
         background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2);
         -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
         -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.3); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .net i { display: block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #fbbf24; }
  .net.on i { background: #4ade80; -webkit-animation: pulse 2s infinite; animation: pulse 2s infinite; }
  .net.off i { background: #ff5d5d; -webkit-box-shadow: 0 0 8px rgba(255,93,93,.9); box-shadow: 0 0 8px rgba(255,93,93,.9); }
  .net.wait i, .net.rules i { background: #fbbf24; -webkit-box-shadow: 0 0 8px rgba(251,191,36,.8); box-shadow: 0 0 8px rgba(251,191,36,.8); }
  @-webkit-keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.8); } 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.8); } 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
  .glass {
    background: rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(255,255,255,.16); border-radius: 22px;
    -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.05), 0 14px 40px rgba(0,0,0,.45);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.05), 0 14px 40px rgba(0,0,0,.45);
  }
  .card { padding: 16px; margin-bottom: 14px; }

  .seg { display: -webkit-box; display: -webkit-flex; display: flex; padding: 5px; margin-bottom: 14px; border-radius: 18px; }
  .seg { position: relative; }
  .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px); border-radius: 14px;
          background: rgba(255,255,255,.17);
          -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 16px rgba(0,0,0,.4);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 16px rgba(0,0,0,.4);
          -webkit-transition: -webkit-transform .38s cubic-bezier(.3,1.25,.5,1); transition: transform .38s cubic-bezier(.3,1.25,.5,1); }
  .seg.r .pill { -webkit-transform: translateX(100%); transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; -webkit-transition: color .3s; transition: color .3s; }
  @-webkit-keyframes inR { from { opacity: 0; -webkit-transform: translateX(46px) scale(.97); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes inR { from { opacity: 0; transform: translateX(46px) scale(.97); } to { opacity: 1; transform: none; } }
  @-webkit-keyframes inL { from { opacity: 0; -webkit-transform: translateX(-46px) scale(.97); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes inL { from { opacity: 0; transform: translateX(-46px) scale(.97); } to { opacity: 1; transform: none; } }
  .panel.fromR { -webkit-animation: inR .42s cubic-bezier(.2,.8,.2,1); animation: inR .42s cubic-bezier(.2,.8,.2,1); }
  .panel.fromL { -webkit-animation: inL .42s cubic-bezier(.2,.8,.2,1); animation: inL .42s cubic-bezier(.2,.8,.2,1); }
  .seg button { -webkit-flex: 1; flex: 1; border: 0; background: transparent; box-shadow: none;
                -webkit-box-shadow: none; border-radius: 14px; padding: 12px 8px; color: rgba(255,232,237,.85); }
  .seg button.on { color: #fff; background: transparent; -webkit-box-shadow: none; box-shadow: none; }

  button, .pick {
    display: block; width: 100%; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: .2px;
    padding: 15px 10px; border-radius: 16px; color: #fdeef1; cursor: pointer;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.3);
    -webkit-appearance: none; appearance: none; font-family: inherit;
  }
  button.main {
    border-color: rgba(255,140,165,.55); color: #fff;
    background: -webkit-linear-gradient(top, rgba(205,48,88,.92), rgba(122,16,48,.85));
    background: linear-gradient(180deg, rgba(205,48,88,.92), rgba(122,16,48,.85));
    -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 26px rgba(205,30,72,.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 26px rgba(205,30,72,.5);
  }
  button:active, .pick:active { opacity: .75; -webkit-transform: scale(.985); transform: scale(.985); }
  button:disabled { opacity: .4; }
  .pick { margin-bottom: 4px; }

  .panel { display: none; }
  .panel.show { display: block; }
  input[type=file] { display: none; }
  #code {
    width: 100%; font-size: 28px; font-weight: 600; letter-spacing: 9px; text-align: center; padding: 14px 10px;
    color: #fff; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.2); border-radius: 16px;

    -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 34px rgba(225,55,95,.42);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 34px rgba(225,55,95,.42);
  }

         border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 8px;
          background: -webkit-linear-gradient(left, #d02e5a, #f3cf94); background: linear-gradient(90deg, #d02e5a, #f3cf94);
          -webkit-box-shadow: 0 0 12px rgba(243,200,140,.65); box-shadow: 0 0 12px rgba(243,200,140,.65);
          -webkit-transition: width .25s; transition: width .25s; }

  #status { padding: 14px 16px; font-size: 15px; line-height: 1.45; min-height: 48px; color: #fdeef1; margin-bottom: 4px; }
  #status.ok { border-color: rgba(70,230,150,.55); color: #b9ffd9; }
  #status.err { border-color: rgba(255,110,110,.6); color: #ffc4c4; }

  #list { margin-top: 12px; }
  #list a {
    display: block; padding: 13px 15px; margin-bottom: 8px; color: #fdeef1; text-decoration: none; font-size: 15px;
    word-wrap: break-word; border-radius: 16px; background: rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.14); -webkit-box-shadow: inset 0 1px 0 rgba(255,255,255,.25); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  #list a span { color: rgba(255,224,230,.55); font-size: 13px; }
  .hint { font-size: 13px; color: rgba(255,224,230,.6); margin: 12px 4px; line-height: 1.5; }
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="wrap">
  <div class="head"><h1>Photo Transfer</h1><div class="net wait" id="net"><i></i><span id="netTxt">Connecting</span></div></div>
  <p class="sub">Send up to 50 photos straight from one phone to another. Photos are never uploaded or stored.</p>

  <div class="seg glass" id="seg"><div class="pill"></div>
    <button id="tabSend" class="on" type="button">Send</button>
    <button id="tabRecv" type="button">Receive</button>
  </div>

  <div id="pSend" class="panel show glass card">
    <label class="pick" for="files">Choose photos (max 50)</label>
    <input id="files" type="file" accept="image/*" multiple>
    <div class="info" id="summary">No photos chosen.</div>
    <button class="main" id="btnCode" type="button">Get code</button>
    <div id="bigcode" style="display:none"></div>
  </div>

  <div id="pRecv" class="panel glass card">
    <input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
    <div style="height:10px"></div>
    <button class="main" id="btnConnect" type="button">Connect</button>
  </div>

  <div class="bar"><div id="fill"></div></div>
  <div id="status" class="glass">Pick Send or Receive.</div>
  <div id="list"></div>
  <button id="btnAll" type="button" style="display:none;margin-top:6px">Save all</button>
  <div class="hint" id="hint" style="display:none">On iPhone: tap a photo, then press and hold it and choose Add to Photos. Keep both screens on until it finishes.</div>
  <div class="info" id="reset" style="display:none"><button id="btnReset" type="button">Start over</button></div>
</div>

<!-- Firebase 8.10.1 on purpose: it still runs on old iPhone Safari -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDZBOuE50BUWWDnoHx7GS9TAw9LejG2uJw",
    authDomain: "photo-tfer.firebaseapp.com",
    projectId: "photo-tfer",
    storageBucket: "photo-tfer.firebasestorage.app",
    messagingSenderId: "207630793685",
    appId: "1:207630793685:web:daa84140a188ce1cfa5b5c"
  };

  var MAX = 50, CH = 16384, HIGH = 1048576, WAIT_MS = 180000;
  var ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  function $(id) { return document.getElementById(id); }
  var statusEl = $("status"), fillEl = $("fill"), listEl = $("list");
  var db = null;
  try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch (e) {}

  var pc = null, dc = null, room = null, unsub = null, waitTimer = null;
  var chosen = [], finished = false, savedLinks = [];

  function say(m, k) { statusEl.className = "glass" + (k ? " " + k : ""); statusEl.textContent = m; }
  function pct(n) { fillEl.style.width = Math.max(0, Math.min(100, n)) + "%"; }
  function mb(n) { return n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  function show(id, on) { $(id).style.display = on ? "block" : "none"; }

  function dropRoom() {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    if (room) { try { room["delete"](); } catch (e2) {} room = null; }
  }
  function closeAll() {
    clearTimeout(waitTimer);
    dropRoom();
    try { if (dc) { dc.onclose = null; dc.close(); } } catch (e) {}
    try { if (pc) pc.close(); } catch (e2) {}
    dc = null; pc = null;
  }
  function fail(m) { closeAll(); say(m, "err"); show("reset", true); }

  window.addEventListener("beforeunload", function () { dropRoom(); });

  function waitIce(p, cb) {
    var done = false;
    function fin() { if (done) return; done = true; cb(); }
    if (p.iceGatheringState === "complete") { fin(); return; }
    p.onicecandidate = function (e) { if (!e.candidate) fin(); };
    p.onicegatheringstatechange = function () { if (p.iceGatheringState === "complete") fin(); };
    setTimeout(fin, 5000);
  }

  function newPeer() {
    pc = new RTCPeerConnection(ICE);
    pc.oniceconnectionstatechange = function () {
      var s = pc ? pc.iceConnectionState : "";
      if (s === "failed" && !finished) fail("Could not connect the two phones. Try the same Wi-Fi on both, then start over.");
    };
  }


  // ---------- online / offline tag ----------
  var netEl = $("net"), netTxt = $("netTxt"), probing = false;
  function setNet(s) {
    netEl.className = "net " + s;
    netTxt.textContent = { on: "Online", off: "Offline", wait: "Connecting", rules: "Rules blocked" }[s];
  }
  function probe() {
    if (!db || navigator.onLine === false) { setNet("off"); return; }
    if (probing) return;
    probing = true;
    var t = setTimeout(function () { probing = false; setNet("off"); }, 8000);
    db.collection("rooms").doc("_ping").get({ source: "server" }).then(function () {
      clearTimeout(t); probing = false; setNet("on");
    })["catch"](function (e) {
      clearTimeout(t); probing = false;
      setNet(e && e.code === "permission-denied" ? "rules" : "off");
    });
  }
  setNet("wait"); probe();
  setInterval(probe, 30000);
  window.addEventListener("online", probe);
  window.addEventListener("offline", function () { setNet("off"); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) probe(); });

  // ---------- tabs ----------
  function tab(which) {
    var send = which === "send";
    $("pSend").className = "panel glass card" + (send ? " show fromL" : "");
    $("pRecv").className = "panel glass card" + (send ? "" : " show fromR");
    $("seg").className = "seg glass" + (send ? "" : " r");
    $("tabSend").className = send ? "on" : "";
    $("tabRecv").className = send ? "" : "on";
    say(send ? "Choose photos, then tap Get code." : "Type the code shown on the sending phone.");
  }
  $("tabSend").addEventListener("click", function () { tab("send"); });
  $("tabRecv").addEventListener("click", function () { tab("recv"); });
  $("btnReset").addEventListener("click", function () { location.reload(); });

  // ---------- SEND ----------
  $("files").addEventListener("change", function () {
    var all = Array.prototype.slice.call(this.files || []);
    chosen = all.slice(0, MAX);
    var total = 0, i;
    for (i = 0; i < chosen.length; i++) total += chosen[i].size;
    var t = chosen.length + (chosen.length === 1 ? " photo" : " photos") + ", " + mb(total);
    if (all.length > MAX) t += " (only the first " + MAX + " were kept)";
    $("summary").textContent = chosen.length ? t : "No photos chosen.";
  });

  $("btnCode").addEventListener("click", function () {
    if (!chosen.length) { say("Choose at least one photo first.", "err"); return; }
    if (!db || !window.RTCPeerConnection) { say("This browser cannot do direct transfer.", "err"); return; }
    $("btnCode").disabled = true;
    makeRoom(0);
  });

  function makeRoom(tries) {
    var code = ("000000" + Math.floor(Math.random() * 1000000)).slice(-6);
    var ref = db.collection("rooms").doc(code);
    ref.get().then(function (snap) {
      if (snap.exists && tries < 5) { makeRoom(tries + 1); return; }
      beginOffer(code, ref);
    })["catch"](function (e) { fail("Could not reach the server: " + (e && e.message ? e.message : e)); });
  }

  function beginOffer(code, ref) {
    newPeer();
    dc = pc.createDataChannel("photos");
    dc.binaryType = "arraybuffer";
    dc.onopen = function () { clearTimeout(waitTimer); dropRoom(); sendAll(); };
    dc.onclose = function () { if (!finished) fail("Connection closed before it finished."); };
    dc.onmessage = function (e) {
      if (typeof e.data === "string" && JSON.parse(e.data).t === "ack") {
        finished = true; pct(100);
        say("All " + chosen.length + " photos sent.", "ok");
        show("reset", true);
        setTimeout(closeAll, 1000);
      }
    };
    pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).then(function () {
      waitIce(pc, function () {
        var d = pc.localDescription;
        ref.set({ offer: { type: d.type, sdp: d.sdp }, expireAt: new Date(new Date().getTime() + 600000) }).then(function () {
          room = ref;
          $("bigcode").textContent = code; show("bigcode", true);
          say("Type this code on the other phone (Receive tab). Waiting...");
          var got = false;
          unsub = ref.onSnapshot(function (s) {
            var v = s.data();
            if (v && v.answer && !got) {
              got = true; say("Connecting...");
              pc.setRemoteDescription(new RTCSessionDescription(v.answer))["catch"](function () { fail("Connection failed. Start over."); });
            }
          });
          waitTimer = setTimeout(function () { fail("Nobody connected within 3 minutes. Start over."); }, WAIT_MS);
        })["catch"](function (e) { fail("Could not reach the server: " + (e && e.message ? e.message : e)); });
      });
    })["catch"](function () { fail("Could not start the connection."); });
  }

  function sendAll() {
    var total = 0, sent = 0, i = 0, k;
    for (k = 0; k < chosen.length; k++) total += chosen[k].size;
    show("bigcode", false);
    say("Sending photos...");
    dc.send(JSON.stringify({ t: "meta", count: chosen.length, total: total }));
    function next() {
      if (i >= chosen.length) { dc.send(JSON.stringify({ t: "done" })); return; }
      var f = chosen[i], r = new FileReader();
      r.onerror = function () { fail("Could not read " + f.name); };
      r.onload = function () {
        var buf = r.result, pos = 0;
        dc.send(JSON.stringify({ t: "file", name: f.name, type: f.type || "image/jpeg", size: buf.byteLength }));
        (function pump() {
          if (!dc || dc.readyState !== "open") return;
          while (pos < buf.byteLength) {
            if (dc.bufferedAmount > HIGH) { setTimeout(pump, 40); return; }
            var part = buf.slice(pos, pos + CH);
            dc.send(part); pos += part.byteLength; sent += part.byteLength;
          }
          dc.send(JSON.stringify({ t: "end" }));
          pct(total ? (sent / total) * 100 : 100);
          say("Sending photo " + (i + 1) + " of " + chosen.length + "...");
          i++; next();
        })();
      };
      r.readAsArrayBuffer(f);
    }
    next();
  }

  // ---------- RECEIVE ----------
  $("code").addEventListener("input", function () { this.value = this.value.replace(/[^0-9]/g, "").slice(0, 6); });

  $("btnConnect").addEventListener("click", function () {
    var code = $("code").value;
    if (code.length !== 6) { say("Enter the 6-digit code first.", "err"); return; }
    if (!db || !window.RTCPeerConnection) { say("This browser cannot do direct transfer.", "err"); return; }
    $("btnConnect").disabled = true;
    say("Looking for the sending phone...");
    var ref = db.collection("rooms").doc(code);
    ref.get().then(function (snap) {
      if (!snap.exists || !snap.data().offer) { $("btnConnect").disabled = false; say("No sender found for this code. On the other phone, tap Get code first.", "err"); return; }
      room = ref;
      listen(snap.data().offer, ref);
    })["catch"](function (e) { fail("Could not reach the server: " + (e && e.message ? e.message : e)); });
  });

  function listen(offer, ref) {
    var cur = null, count = 0, total = 0, got = 0, made = 0;
    newPeer();
    pc.ondatachannel = function (ev) {
      dc = ev.channel; dc.binaryType = "arraybuffer";
      dc.onclose = function () { if (!finished) fail("Connection closed before it finished."); };
      dc.onmessage = function (e) {
        var d = e.data, m;
        if (typeof d === "string") {
          m = JSON.parse(d);
          if (m.t === "meta") { count = m.count; total = m.total; clearTimeout(waitTimer); say("Receiving " + count + " photos (" + mb(total) + ")..."); }
          else if (m.t === "file") { cur = { name: m.name, type: m.type, parts: [], size: 0 }; }
          else if (m.t === "end") { addRow(cur); cur = null; made++; say("Received " + made + " of " + count + "..."); }
          else if (m.t === "done") {
            finished = true; pct(100); say("Done. " + made + " photos received.", "ok");
            show("hint", true); show("reset", true);
            if ("download" in document.createElement("a")) show("btnAll", true);
            dc.send(JSON.stringify({ t: "ack" }));
          }
        } else if (cur) {
          cur.parts.push(d); cur.size += d.byteLength; got += d.byteLength;
          pct(total ? (got / total) * 100 : 0);
        }
      };
    };
    pc.setRemoteDescription(new RTCSessionDescription(offer)).then(function () { return pc.createAnswer(); })
      .then(function (a) { return pc.setLocalDescription(a); })
      .then(function () {
        waitIce(pc, function () {
          var d = pc.localDescription;
          ref.update({ answer: { type: d.type, sdp: d.sdp } }).then(function () {
            room = null;
            say("Connecting...");
            waitTimer = setTimeout(function () { if (!finished && !count) fail("Could not connect. Start over."); }, 60000);
          })["catch"](function () { fail("The sender is gone. Ask them to tap Get code again."); });
        });
      })["catch"](function () { fail("Could not start the connection."); });
  }

  function addRow(f) {
    var blob = new Blob(f.parts, { type: f.type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.setAttribute("download", f.name);
    a.appendChild(document.createTextNode(f.name + " "));
    var s = document.createElement("span"); s.textContent = "(" + mb(f.size) + ")";
    a.appendChild(s);
    listEl.appendChild(a);
    savedLinks.push(a);
  }

  $("btnAll").addEventListener("click", function () {
    var i = 0;
    (function go() { if (i >= savedLinks.length) return; savedLinks[i].click(); i++; setTimeout(go, 500); })();
  });
})();
</script>
</body>
</html>
